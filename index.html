    crossorigin="anonymous"
    data-preload-chunks="slam">
  </script>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    AFRAME.registerComponent("apply-glass-texture", {
      init: function () {
        const el = this.el;

        el.addEventListener("model-loaded", function () {
          const texture = new THREE.TextureLoader().load(
            "assets/images/glass.png"
          );

          el.object3D.traverse(function (node) {
            if (node.isMesh) {
              node.material = new THREE.MeshStandardMaterial({
                map: texture,
                transparent: true,
                opacity: 0.45,
                roughness: 0.03,
                metalness: 0.05
              });

              node.material.needsUpdate = true;
            }
          });
        });
      }
    });
  </script>

<script>
window.addEventListener("load", () => {
  const interview = document.querySelector("#interviewVideo");
  const animated = document.querySelector("#animatedVideo");

  const startVideos = async () => {
    try {
      // Main interview video with audio
      interview.muted = false;
      interview.volume = 1.0;
      interview.playsInline = true;

      // Secondary animated video without audio
      animated.muted = true;
      animated.volume = 0;
      animated.playsInline = true;

      await Promise.all([
        interview.play(),
        animated.play()
      ]);

      console.log("Both videos started");
    } catch (e) {
      console.error("Video playback failed:", e);
    }
  };

  document.body.addEventListener(
    "touchstart",
    startVideos,
    { once: true }
  );

  document.body.addEventListener(
    "click",
    startVideos,
    { once: true }
  );
});
</script>
